role: both

monitor:
  orderbook_depth: 20
  batch_size: 500
  batch_interval: 5
  ring_buffer_size: 10000
  save_interval: 5

trader:
  max_open_orders: 10
  max_position_size: 1000.0
  default_strategy: grid
  strategy_update_interval: 10
  slippage_percent: 0.5
  enable_backtest: false

orderbook:
  debug_log_raw: false
  debug_log_msg: false

core_connections:
  ws:
    enabled: true
    url: "wss://cts-core:8080/ws"
    reconnect_delay_sec: 1
    heartbeat_interval_sec: 5
    write_timeout: 5s
    version: "2.0.2"
    region: "local"
    tls:
      ca_path: "conf/ssl/ca.crt"
      cert_path: "conf/ssl/trader-client.crt"
      key_path: "conf/ssl/trader-client.key"
      server_name: "cts-core"
  rest:
    enabled: false
    url: "http://cts-core:8080/api/v1"

databases:
  quotes:
    engine: clickhouse
    clickhouse:
      host: localhost
      port: 8123
      database: crypto
      username: default
      password: default
      tls:
        enabled: false
        skip_verify: false
        ca_path: ""
        cert_path: ""
        key_path: ""
      pool:
        connect_timeout: 10
        max_batch_size: 10000
        replication_factor: 1
      retry:
        max_attempts: 3
        initial_delay: 1s
        max_delay: 5s
        multiplier: 2.0
      compression: true

logging:
  level: info
  format: json
  compress: false
  error_path: "/var/log/trader/error.log"
  out_request_path: "/var/log/trader/out_request.log"
  ws_core_path: "/var/log/trader/ws_core.log"
  ws_exchanges_path: "/var/log/trader/ws_exchanges.log"
  audit_path: "/var/log/trader/audit.log"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  out_request_to_stdout: true
  ws_core_to_stdout: true
  ws_exchanges_to_stdout: true
  ws_exchanges_log_enable: true
  ws_exchange_single_log_enable: true
  audit_to_stdout: true

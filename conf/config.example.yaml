role: both

monitor:
  orderbook_depth: 20
  batch_size: 500
  batch_interval: 5
  ring_buffer_size: 10000
  save_interval: 5

trader:
  max_open_orders: 10
  max_position_size: 1000.0
  default_strategy: grid
  strategy_update_interval: 10
  slippage_percent: 0.5
  enable_backtest: false

trade:
  update_interval: 5

orderbook:
  debug_log_raw: false
  debug_log_msg: false

databases:
  quotes:
    engine: clickhouse
    clickhouse:
      host: localhost
      port: 8123
      database: crypto
      username: default
      password: default
      tls:
        enabled: false
        skip_verify: false
        ca_path: ""
        cert_path: ""
        key_path: ""
      pool:
        connect_timeout: 10
        max_batch_size: 10000
        replication_factor: 1
      retry:
        max_attempts: 3
        initial_delay: 1s
        max_delay: 5s
        multiplier: 2.0
      compression: true

logging:
  level: info
  format: json
  compress: false
  error_path: "/var/log/trader/error.log"
  out_request_path: "/var/log/trader/out_request.log"
  ws_in_path: "/var/log/trader/ws_in.log"
  ws_out_path: "/var/log/trader/ws_out.log"
  audit_path: "/var/log/trader/audit.log"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  out_request_to_stdout: true
  ws_in_to_stdout: true
  ws_out_to_stdout: true
  audit_to_stdout: true
